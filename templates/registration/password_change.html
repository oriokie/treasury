{% extends 'base.html' %}
{% block content %}
<div class="page-head"><h1>Change password</h1></div>
<div class="card" style="max-width:480px"><div class="bd">
  <form method="post">{% csrf_token %}
    {% for f in form %}<div class="form-row"><label for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}
      {% for e in f.errors %}<div class="errorlist">{{ e }}</div>{% endfor %}</div>{% endfor %}
    <button class="btn">Update password</button>
  </form>
</div></div>
{% endblock %}
