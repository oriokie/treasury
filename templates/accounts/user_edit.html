{% extends 'base.html' %}
{% block title %}Edit {{ object.username }} · {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="page-head"><div><h1>{{ object.username }}</h1><div class="sub">{{ object.get_full_name|default:"Role &amp; account status" }}</div></div></div>
<div class="card u-narrow"><div class="bd">
  <form method="post"><div class="form-grid">{% csrf_token %}{% include 'partials/form_fields.html' %}</div>
    <div class="btn-row"><button class="btn">Save changes</button><a class="btn btn-ghost" href="{% url 'user_list' %}">Cancel</a></div>
  </form>
</div></div>
{% endblock %}
