<form method="get" class="period-bar">
  <div class="f"><label>From</label><input type="date" name="start" value="{{ start|date:'Y-m-d' }}" class="field"></div>
  <div class="f"><label>To</label><input type="date" name="end" value="{{ end|date:'Y-m-d' }}" class="field"></div>
  <button class="btn btn-sm">Apply</button>
  {% block period_extra %}{% endblock %}
</form>
